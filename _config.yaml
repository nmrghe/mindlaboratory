# site properties and page defaults
title: M!ND Lab
subtitle: Mapping Intell!gent behavior onto Neural Dynamics
description: Our goal is to understand how the richness of our “mental life” –– our thoughts, plans and expectations –– emerges from biology.
header: images/background.jpg
footer: images/background.jpg
proofer: false
show-title: true

# site social media and other links
links:
  email: nicolas.meirhaeghe@cnrs.fr
  orcid: 0000-0002-3785-0696
  google-scholar: https://scholar.google.com/citations?user=gXpQelwAAAAJ&hl=fr&oi=ao
  github: nmrghe
  twitter: nicognitive
  bluesky: test

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
